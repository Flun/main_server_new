# Install as ~/.config/sunshine/sunshine.conf
# LAN-only management and pairing. Router port forwarding/UPnP stays disabled.
address_family = ipv4
origin_web_ui_allowed = lan
csrf_allowed_origins = https://192.168.1.243:47990
upnp = disabled

# NVIDIA RTX 3090: hardware capture and encoding on the X11 desktop.
encoder = nvenc
capture = nvfbc
# xrandr --listmonitors index 0: primary DP-4 only (not the 5120x1440 desktop).
output_name = 0

lan_encryption_mode = 1
wan_encryption_mode = 2
stream_audio = enabled
